<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Escape Land</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"DM Sans",sans-serif;background:#eef3f1;color:#103f47}
    .login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr 470px}
    .login-visual{position:relative;min-height:100vh;background:linear-gradient(90deg,rgba(5,43,49,.78),rgba(5,43,49,.18)),url("https://images.pexels.com/photos/261102/pexels-photo-261102.jpeg?auto=compress&cs=tinysrgb&w=1600") center/cover}
    .login-visual .brand{position:absolute;top:28px;left:38px;width:180px;height:68px;background:white;border-radius:8px;padding:5px}.login-visual img{width:100%;height:100%;object-fit:contain}
    .visual-copy{position:absolute;left:38px;bottom:55px;color:white}.visual-copy p{font-size:11px;letter-spacing:2px;font-weight:800}.visual-copy h1{font-family:"Manrope";font-size:48px;line-height:1.05;margin:10px 0}.visual-copy h1 em{color:#ffc75a;font-style:normal}
    .login-panel{background:white;display:flex;align-items:center;justify-content:center;padding:44px}.login-card{width:min(340px,100%)}.login-card .eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#d18a1b}.login-card h2{font-family:"Manrope";font-size:32px;margin:8px 0}.login-card>p{color:#74837f;line-height:1.6;font-size:14px}
    .login-card label{display:grid;gap:7px;font-size:12px;font-weight:800;margin-top:15px}.login-card input{height:48px;border:1px solid #dce5e2;border-radius:6px;padding:0 12px;outline:none}.login-card input:focus{border-color:#f5a11a;box-shadow:0 0 0 3px rgba(245,161,26,.12)}
    .login-options{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.login-options label{display:flex;align-items:center;gap:6px;margin:0;font-size:12px}.login-options a{font-size:12px;color:#103f47;font-weight:800;text-decoration:none}.login-button{width:100%;height:52px;border:0;border-radius:6px;background:#f5a11a;color:#082f35;font-weight:800}.demo-note{margin-top:14px;background:#eff5f3;border-radius:6px;padding:10px;font-size:11px;color:#687974}.demo-note strong{color:#103f47}.back-link{display:block;text-align:center;margin-top:18px;color:#103f47;font-size:12px;font-weight:800;text-decoration:none}
    @media(max-width:850px){.login-shell{grid-template-columns:1fr}.login-visual{min-height:260px}.login-panel{min-height:calc(100vh - 260px)}.visual-copy h1{font-size:36px}.visual-copy{bottom:26px}.login-visual .brand{top:18px;left:20px}}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-visual">
      <a class="brand" href="index.html"><img src="logo.jpg" alt="HorizonCore Systems"></a>
      <div class="visual-copy"><p>PENANG OPERATIONS</p><h1>One system.<br><em>Every experience.</em></h1></div>
    </section>
    <section class="login-panel">
      <form class="login-card" id="staffLogin">
        <p class="eyebrow">STAFF & MANAGEMENT</p>
        <h2>Welcome back</h2>
        <p>Sign in to manage gate entry, room schedules and revenue insights.</p>
        <label>Staff email<input type="email" id="staffEmail" value="staff@escapeland.my" required></label>
        <label>Password<input type="password" id="staffPassword" value="escape2026" required></label>
        <div class="login-options"><label><input type="checkbox" checked> Remember me</label><a href="#">Forgot password?</a></div>
        <button class="login-button" type="submit">Sign in to portal →</button>
        <div class="demo-note"><strong>Demo access:</strong> use any email and password.</div>
        <a class="back-link" href="index.html">← Return to Escape Land</a>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("staffLogin").addEventListener("submit", event => {
      event.preventDefault();
      localStorage.setItem("escapeLandStaffLogin","demo");
      window.location.href="staff-portal.html";
    });
  </script>
</body>
</html>
